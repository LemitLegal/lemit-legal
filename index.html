<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legal · Lemit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root { --surface:#fafaf3; --card:#ffffff; --ink:#1a1c18; --ink-variant:#434843; --outline:#c3c8c1; --emerald:#059669; --leaf:#d1fae5; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin:0; background:var(--surface); color:var(--ink); font:16px/1.6 "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }
.brand { display:inline-block; font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--emerald); background:var(--leaf); padding:4px 10px; border-radius:999px; }
h1 { font-family:"Playfair Display", Georgia, serif; font-weight:600; font-size:32px; line-height:1.2; margin:16px 0 8px; }
h2 { font-family:"Playfair Display", Georgia, serif; font-weight:600; font-size:22px; margin:36px 0 10px; padding-top:20px; border-top:1px solid var(--outline); }
h3 { font-size:16px; font-weight:600; margin:24px 0 6px; }
p, li { color:var(--ink-variant); }
strong { color:var(--ink); }
a { color:var(--emerald); }
code { font-size:.9em; background:#eeeee7; padding:1px 6px; border-radius:6px; }
table { width:100%; border-collapse:collapse; margin:12px 0; background:var(--card); border-radius:14px; overflow:hidden; font-size:14px; }
th, td { text-align:left; vertical-align:top; padding:10px 12px; border-bottom:1px solid #eeeee7; }
th { color:var(--ink); font-weight:600; background:#f4f4ed; }
nav.links { margin-top:40px; display:flex; gap:16px; font-size:14px; }
.card { display:block; background:var(--card); border-radius:16px; padding:18px 20px; margin:12px 0; text-decoration:none; color:var(--ink); box-shadow:0 1px 3px rgba(26,28,24,.06); }
.card span { display:block; color:var(--ink-variant); font-size:14px; }
</style>
</head>
<body>
<main>
<span class="brand">Lemit</span>
<h1>Lemit legal</h1>
<a class="card" href="lemit/terms/"><strong>Terms of Use</strong><span>Rules for using Lemit, Sprigs and In-App Purchases.</span></a>
<a class="card" href="lemit/privacy/"><strong>Privacy Policy</strong><span>What Lemit stores, permissions and how to delete your data.</span></a>
<nav class="links"><a href="lemit/terms/">Terms of Use</a><a href="lemit/privacy/">Privacy Policy</a></nav>
</main>
</body>
</html>
